<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UACE Coach</title>
    <link rel="stylesheet" href="style.css">

    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- KaTeX CSS & JS for LaTeX Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
</head>
<body>

    <header>
        <div class="brand">
            <h1>UACE Coach</h1>
            <div class="breadcrumb" id="breadcrumb">Select Subject</div>
        </div>
        <button class="reset-btn" onclick="resetApp()">Home</button>
    </header>

    <button class="btn-back" id="back-btn" onclick="goBack()">← Back</button>

    <!-- Navigation Grid -->
    <div class="grid" id="menu-grid"></div>

    <!-- Active Chat Screen -->
    <div id="chat-container">
        <div id="chat-box"></div>
        <div class="input-row">
            <input type="text" id="user-input" placeholder="Ask a question..." onkeypress="handleKey(event)">
            <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script src="app.js" defer></script>
</body>
        </html>
