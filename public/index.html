<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UACE Coach</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #2563eb;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            color: #38bdf8;
        }

        .breadcrumb {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 6px;
            height: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            width: 100%;
            max-width: 500px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease;
            user-select: none;
        }

        .card:active {
            transform: scale(0.97);
            border-color: var(--accent);
        }

        .btn-back {
            background: none;
            border: 1px solid #334155;
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            cursor: pointer;
            display: none;
        }

        /* Chat Drawer */
        #chat-container {
            display: none;
            flex-direction: column;
            width: 100%;
            max-width: 500px;
            height: 60vh;
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid #334155;
            overflow: hidden;
        }

        #chat-box {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .msg.user {
            align-self: flex-end;
            background-color: var(--accent);
        }

        .msg.bot {
            align-self: flex-start;
            background-color: #334155;
        }

        .input-row {
            display: flex;
            border-top: 1px solid #334155;
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 14px;
            color: white;
            outline: none;
        }

        button.send-btn {
            background: var(--accent);
            border: none;
            color: white;
            padding: 0 20px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>UACE Coach</h1>
        <div class="breadcrumb" id="breadcrumb">Select a Subject</div>
    </header>

    <button class="btn-back" id="back-btn" onclick="goBack()">← Back</button>

    <div class="grid" id="menu-grid"></div>

    <div id="chat-container">
        <div id="chat-box"></div>
        <div class="input-row">
            <input type="text" id="user-input" placeholder="Ask a question..." onkeypress="handleKey(event)">
            <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        // UNEB Curriculum Hierarchy Map
        const curriculum = {
            "MATH": {
                "Paper 1 (Pure Math)": ["Algebra & Polynomials", "Trigonometry", "Calculus (Diff & Int)", "Coordinate Geometry"],
                "Paper 2 (Applied Math)": ["Mechanics & Statics", "Probability & Statistics", "Numerical Methods"]
            },
            "PHYSICS": {
                "Paper 1": ["Mechanics & Properties of Matter", "Heat & Thermodynamics", "Modern & Nuclear Physics"],
                "Paper 2": ["Optics & Light", "Waves", "Electricity & Electromagnetism"]
            },
            "CHEMISTRY": {
                "Paper 1 & 2": ["Physical Chemistry", "Inorganic Chemistry Trends", "Organic Reactions & Mechanisms"]
            }
        };

        let history = [];
        let selectedSubject = "";
        let selectedPaper = "";
        let selectedTopic = "";

        const grid = document.getElementById("menu-grid");
        const backBtn = document.getElementById("back-btn");
        const breadcrumb = document.getElementById("breadcrumb");
        const chatContainer = document.getElementById("chat-container");

        function renderMainMenu() {
            history = [];
            backBtn.style.display = "none";
            chatContainer.style.display = "none";
            grid.style.display = "grid";
            breadcrumb.innerText = "Select a Subject";
            
            grid.innerHTML = Object.keys(curriculum).map(sub => 
                `<div class="card" onclick="selectSubject('${sub}')">${sub}</div>`
            ).join("");
        }

        function selectSubject(sub) {
            history.push(() => renderMainMenu());
            selectedSubject = sub;
            backBtn.style.display = "block";
            breadcrumb.innerText = `${sub} › Select Paper`;

            const papers = Object.keys(curriculum[sub]);
            grid.innerHTML = papers.map(paper => 
                `<div class="card" onclick="selectPaper('${paper}')">${paper}</div>`
            ).join("");
        }

        function selectPaper(paper) {
            history.push(() => selectSubject(selectedSubject));
            selectedPaper = paper;
            breadcrumb.innerText = `${selectedSubject} › ${paper} › Select Topic`;

            const topics = curriculum[selectedSubject][paper];
            grid.innerHTML = topics.map(topic => 
                `<div class="card" onclick="startChat('${topic}')">${topic}</div>`
            ).join("");
        }

        function startChat(topic) {
            history.push(() => selectPaper(selectedPaper));
            selectedTopic = topic;
            grid.style.display = "none";
            chatContainer.style.display = "flex";
            breadcrumb.innerText = `${selectedSubject} › ${selectedTopic}`;

            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML = `<div class="msg bot">Hello! I am your UACE tutor for <b>${selectedTopic}</b>. Ask me any question or past-paper problem from this topic.</div>`;
        }

        function goBack() {
            if (history.length > 0) {
                const lastStep = history.pop();
                lastStep();
            }
        }

        async function sendMessage() {
            const input = document.getElementById("user-input");
            const text = input.value.trim();
            if (!text) return;

            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML += `<div class="msg user">${text}</div>`;
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // Send payload to backend
            try {
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        subject: selectedSubject,
                        topic: selectedTopic,
                        message: text
                    })
                });
                const data = await res.json();
                chatBox.innerHTML += `<div class="msg bot">${data.reply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (err) {
                chatBox.innerHTML += `<div class="msg bot">Error connecting to tutor service.</div>`;
            }
        }

        function handleKey(e) {
            if (e.key === "Enter") sendMessage();
        }

        // Initialize UI
        renderMainMenu();
    </script>
</body>
  </html>
