<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UACE Coach</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>UACE Coach</h1>
        <div class="breadcrumb" id="breadcrumb">Select a Subject</div>
    </header>

    <button class="btn-back" id="back-btn" onclick="goBack()">← Back</button>

    <!-- Navigation Grid -->
    <div class="grid" id="menu-grid"></div>

    <!-- Active Chat Screen -->
    <div id="chat-container">
        <div id="chat-box"></div>
        <div class="input-row">
            <input type="text" id="user-input" placeholder="Ask a question..." onkeypress="handleKey(event)">
            <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <!-- Added defer to ensure HTML elements exist before JS runs -->
    <script src="app.js" defer></script>
</body>
        </html>
